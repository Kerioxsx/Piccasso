name: Website
# Publishes the website (site/) at the root and the web app (web/) at /app/ on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # build and publish are separate jobs: deploy-pages looks the upload up through
  # the API, which can lag behind an upload made moments earlier in the same job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r web/. _site/app/
          rm -rf _site/README.md _site/app/README.md _site/app/tests
          touch _site/.nojekyll
          # a new cache name on every deploy, so installed web apps pick up the update
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'piccasso-${GITHUB_SHA::12}'/" _site/app/sw.js
          grep -q "piccasso-${GITHUB_SHA::12}" _site/app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
