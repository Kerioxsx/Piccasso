name: Desktop app
# Builds the Rust desktop app and publishes it as a GitHub release, so the
# website's download buttons always get the newest build:
#   Windows x64, macOS universal (Apple Silicon + Intel) .app, Linux x64 and ARM64.
on:
  push:
    branches: [main]
    paths: ['rust/**', 'shared/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  # the version the app reports and compares with the latest release when it checks for updates
  PICCASSO_VERSION: 0.1.${{ github.run_number }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p piccasso-app
        working-directory: rust
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Piccasso
          cp README.md rust/target/release/piccasso.exe dist/Piccasso/
          (cd dist && 7z a ../Piccasso-windows.zip Piccasso >/dev/null)
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Piccasso-windows.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build for Apple Silicon and Intel
        working-directory: rust
        run: |
          cargo build --release -p piccasso-app --target aarch64-apple-darwin
          cargo build --release -p piccasso-app --target x86_64-apple-darwin
      - name: Universal Piccasso.app
        run: |
          app=dist/Piccasso.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          lipo -create -output "$app/MacOS/piccasso" \
            rust/target/aarch64-apple-darwin/release/piccasso \
            rust/target/x86_64-apple-darwin/release/piccasso
          lipo -info "$app/MacOS/piccasso"
          version=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          sed "s/VERSION/$version/g" rust/packaging/Info.plist > "$app/Info.plist"
          # icon set from the 512 px app icon
          mkdir piccasso.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s web/icons/icon-512.png --out piccasso.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d web/icons/icon-512.png --out piccasso.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns piccasso.iconset -o "$app/Resources/piccasso.icns"
          # ad-hoc signature (required for Apple Silicon); not notarised
          codesign --force --deep --sign - dist/Piccasso.app
          codesign --verify --verbose dist/Piccasso.app
          cp README.md dist/
          (cd dist && ditto -c -k --keepParent Piccasso.app ../Piccasso-macos.zip)
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: Piccasso-macos.zip }

  linux:
    strategy:
      matrix:
        include:
          # built on an older Ubuntu so the app runs on any Linux with glibc 2.35+
          # (Ubuntu 22.04+, Debian 12+, Fedora 36+, Raspberry Pi OS bookworm+)
          - runner: ubuntu-22.04
            asset: Piccasso-linux.tar.gz
          - runner: ubuntu-22.04-arm
            asset: Piccasso-linux-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo build --release -p piccasso-app
        working-directory: rust
      - name: Package
        run: |
          mkdir -p dist/Piccasso
          cp README.md rust/target/release/piccasso rust/packaging/piccasso.desktop rust/packaging/install-linux.sh dist/Piccasso/
          cp web/icons/icon-512.png dist/Piccasso/piccasso.png
          tar -czf ${{ matrix.asset }} -C dist Piccasso
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.asset }}', path: '${{ matrix.asset }}' }

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Piccasso 0.1.${{ github.run_number }}
          body: |
            Native Rust desktop app.
            - Windows: unzip, run piccasso.exe
            - macOS (Apple Silicon and Intel): unzip, drag Piccasso.app to Applications; first time, right-click → Open (not notarised)
            - Linux x64 / ARM64: unpack, run ./piccasso, or ./install-linux.sh to add it to your app menu
          files: assets/*
