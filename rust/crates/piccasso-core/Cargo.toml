[package]
name = "piccasso-core"
version.workspace = true
edition.workspace = true
description = "Piccasso core: image processing, drawing-plan analysis, step generation, project format and storage."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
