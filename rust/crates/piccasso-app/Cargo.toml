[package]
name = "piccasso-app"
version.workspace = true
edition.workspace = true
description = "Piccasso desktop app (egui)."

[[bin]]
name = "piccasso"
path = "src/main.rs"

[features]
default = ["keepawake", "autodraw", "phone"]
autodraw = ["dep:enigo", "dep:x11rb"]
phone = ["dep:tiny_http", "dep:rcgen", "dep:qrcode"]
camera = ["dep:nokhwa"]
ai = ["dep:ureq"]

[dependencies]
piccasso-core = { path = "../piccasso-core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.31"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keepawake = { version = "0.5", optional = true }
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
base64 = "0.22"
enigo = { version = "0.3", default-features = false, features = ["x11rb"], optional = true }
tiny_http = { version = "0.12", features = ["ssl-rustls"], optional = true }
rcgen = { version = "0.13", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }
