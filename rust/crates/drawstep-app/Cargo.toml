[package]
name = "drawstep-app"
version.workspace = true
edition.workspace = true
description = "DrawStep desktop app (egui)."

[[bin]]
name = "drawstep"
path = "src/main.rs"

[features]
default = ["keepawake"]
camera = ["dep:nokhwa"]
ai = ["dep:ureq"]

[dependencies]
drawstep-core = { path = "../drawstep-core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.31"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keepawake = { version = "0.5", optional = true }
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
base64 = "0.22"
